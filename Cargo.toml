[package]
name = "proxyforge"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Fast, concurrent proxy checker for HTTP, HTTPS, SOCKS4 and SOCKS5 proxies"
license = "MIT"
repository = "https://github.com/OWNER/proxyforge"
homepage = "https://github.com/OWNER/proxyforge"
keywords = ["proxy", "proxy-checker", "socks5", "cli"]
categories = ["command-line-utilities", "network-programming"]
exclude = ["/.github", "/tests/fixtures"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
comfy-table = "8.0.1"
csv = "1.4.0"
indicatif = "0.18.6"
rustls = "0.23.46"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "time",
    "sync",
    "signal",
    "fs",
] }
tokio-rustls = "0.26.6"
url = "2.5.8"
webpki-roots = "1.0.12"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
